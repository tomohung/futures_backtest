[project]
name = "futures-backtest"
version = "0.1.0"
description = "台指期當沖策略回測系統"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "backtesting>=0.3.3",
    "scipy>=1.17.1",
    "matplotlib>=3.10.8",
    "mplfinance>=0.12.10b0",
    "yfinance>=1.3.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "cachetools>=5.3",
    "httpx>=0.27",
    "finmind>=1.9.11",
    "tqdm>=4.68.1",
]

[project.scripts]
chart-ui = "src.chart_ui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
